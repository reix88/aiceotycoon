<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which AI CEO Tycoon ending would you get? — Quiz</title>
<meta name="description" content="9 dilemmas from the game. One minute. Will your AI save humanity — or end it? Find out which of 11 endings you'd get.">
<meta name="theme-color" content="#0b0918">
<meta property="og:type" content="website">
<meta property="og:title" content="Which AI ending would you get?">
<meta property="og:description" content="9 dilemmas, 1 minute, 11 possible endings. Will your AI save humanity — or end it?">
<meta property="og:image" content="https://reix88.github.io/aiceotycoon/quiz/img/cover.jpg">
<meta property="og:url" content="https://reix88.github.io/aiceotycoon/quiz/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://reix88.github.io/aiceotycoon/quiz/img/cover.jpg">
<link rel="icon" type="image/png" href="../assets/img/icon-64.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/site.css">
<style>
  body { min-height: 100vh; background: radial-gradient(900px 520px at 85% -5%, rgba(139,108,255,.22), transparent 70%), radial-gradient(800px 480px at -5% 60%, rgba(255,122,184,.12), transparent 70%),
    radial-gradient(700px 400px at 100% 100%, rgba(98,230,214,.1), transparent 70%), var(--bg); }
  .stage { max-width: 680px; margin: 0 auto; padding: calc(var(--header) + 28px) var(--gutter) 48px; }
  .panel { background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r-lg); padding: clamp(18px, 3.4vw, 30px); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.7); }
  .fade { animation: fade .35s ease; }
  @keyframes fade { from { opacity: .4; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .cover { width: 100%; aspect-ratio: 1200 / 630; object-fit: cover; border-radius: calc(var(--r-lg) - 8px); display: block; background: #000; }
  .q-title { font: 800 clamp(26px, 6vw, 40px)/1.1 var(--f-display); margin: 14px 0 10px; text-wrap: balance; }
  .q-title em { font-style: normal; background: linear-gradient(92deg, var(--amber), #ff8a7a 45%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .q-lead { color: var(--muted); margin: 0 0 22px; }
  .actions, .result-actions { display: grid; gap: 10px; }
  .actions .btn, .result-actions .btn { width: 100%; }
  .meta-row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 18px; color: var(--muted); font-size: 14px; }
  .meta-row b { color: var(--ink); font-family: var(--f-display); }
  .progress { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .progress .bar { flex: 1; height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
  .progress .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--teal), var(--amber)); transition: width .35s; }
  .progress span { font: 800 13px/1 var(--f-display); color: var(--muted); }
  .question { font: 800 clamp(20px, 4.4vw, 28px)/1.25 var(--f-display); margin: 12px 0 20px; text-wrap: balance; }
  .answers { display: grid; gap: 10px; }
  .answers button { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; min-height: 58px; padding: 12px 16px 12px 12px; border-radius: 16px; cursor: pointer;
    background: rgba(255,255,255,.05); color: var(--ink); border: 1px solid var(--line2); font: 600 16px/1.35 var(--f-body); transition: background .15s, border-color .15s, transform .12s; }
  .answers button:active { transform: scale(.985); }
  .answers .k { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; font: 800 14px/1 var(--f-display); background: rgba(98,230,214,.12); color: var(--teal); border: 1px solid rgba(98,230,214,.3); }
  @media (hover: hover) { .answers button:hover { background: rgba(98,230,214,.1); border-color: rgba(98,230,214,.55); } }
  .back { margin-top: 14px; background: none; border: 0; color: var(--muted); font: 600 14px/1 var(--f-body); cursor: pointer; padding: 8px 0; }
  .back:hover { color: var(--ink); }
  .top-gap { margin-top: 22px; }
  .rname { font: 800 clamp(30px, 7.5vw, 48px)/1.08 var(--f-display); margin: 8px 0 10px; background: linear-gradient(92deg, var(--amber), #ff8a7a 45%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rdesc { font-weight: 600; font-size: 18px; margin: 0 0 12px; }
  .flavor { color: var(--muted); border-left: 3px solid var(--amber); padding: 4px 0 4px 14px; margin: 0; font-style: italic; }
  .share-h { font: 800 12.5px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 26px 0 12px; }
  .share { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .share a, .share button { display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 12px; background: rgba(255,255,255,.06); color: var(--ink);
    border: 1px solid var(--line2); text-decoration: none; font: 600 14.5px/1 var(--f-body); cursor: pointer; }
  .share a:hover, .share button:hover { background: rgba(255,255,255,.12); }
  .share .main { grid-column: 1 / -1; background: var(--teal); color: #072320; border: 0; font-weight: 700; min-height: 52px; }
  .hint { color: var(--muted); margin: 22px 0 14px; }
  .others .row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .others img { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; border: 1px solid var(--line2); flex: none; opacity: .7; }
  .others img.me { opacity: 1; outline: 2px solid var(--amber); outline-offset: 2px; }
  @media (max-width: 420px) { .share { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header class="site-header solid">
  <div class="wrap">
    <a class="brand" href="../"><img src="../assets/img/icon-64.png" alt="" width="36" height="36"><span>AI CEO <b>TYCOON</b></span></a>
    <div class="header-actions" style="margin-left:auto">
      <div class="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="ru">RU</button></div>
      <a class="btn btn-ghost btn-sm" href="../" style="display:inline-flex" id="home">← Home</a>
    </div>
  </div>
</header>

<main class="stage">
  <div class="panel fade" id="screen"></div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <a class="brand" href="../"><img src="../assets/img/icon-64.png" alt="" width="36" height="36"><span>AI CEO <b>TYCOON</b></span></a>
    <nav><a class="play-foot" href="#" target="_blank" rel="noopener">Google Play</a><a href="../privacy/" id="fPriv">Privacy Policy</a></nav>
    <span>© 2026 Red Pixels</span>
  </div>
</footer>

<script src="quiz-data.js"></script>
<script>
'use strict';
const Q = window.QUIZ;
const BASE = 'https://reix88.github.io/aiceotycoon/quiz/';
const PLAY = 'https://play.google.com/store/apps/details?id=com.redpixels.aiceotycoon';
const IMG = (id) => '../assets/img/end/' + (Q.endings[id].img || id) + '.webp';
const T = {
  en: {
    eyebrow: 'Quiz · 1 minute', title: 'Which AI ending <em>would you get?</em>', lead: '9 dilemmas from the game AI CEO Tycoon. Will your AI save humanity — or end it?',
    start: 'Start the quiz', q: 'Question', back: '← Previous question', your: 'Your ending', of: 'one of 11', again: 'Take the quiz again',
    shareH: 'Share your ending', shareMain: 'Share', copy: 'Copy link', copied: 'Copied!', home: '← Home', priv: 'Privacy Policy', free: 'Free on',
    m1: 'dilemmas', m2: 'endings', m3: 'minute', others: 'All 11 endings',
    shareText: (n) => `I got “${n}” in the AI CEO Tycoon quiz. Which ending would you get?`,
    hint: 'In the real game every choice matters: ~200 story events, 11 endings and one suspicious office cat.',
  },
  ru: {
    eyebrow: 'Тест · 1 минута', title: 'Какую концовку <em>получишь ты?</em>', lead: '9 дилемм из игры Ai CEO Tycoon. Твой ИИ спасёт человечество — или погубит его?',
    start: 'Начать тест', q: 'Вопрос', back: '← Предыдущий вопрос', your: 'Твоя концовка', of: 'одна из 11', again: 'Пройти ещё раз',
    shareH: 'Поделись концовкой', shareMain: 'Поделиться', copy: 'Скопировать ссылку', copied: 'Скопировано!', home: '← На главную', priv: 'Политика конфиденциальности', free: 'Бесплатно в',
    m1: 'дилемм', m2: 'концовок', m3: 'минута', others: 'Все 11 концовок',
    shareText: (n) => `Мне выпала концовка «${n}» в тесте Ai CEO Tycoon. А какая будет у тебя?`,
    hint: 'В самой игре важен каждый выбор: ~200 сюжетных событий, 11 концовок и один подозрительный офисный кот.',
  },
};
const params = new URLSearchParams(location.search);
let lang = params.get('lang') || '';
if (!T[lang]) { try { lang = localStorage.getItem('site.lang') || ''; } catch (e) { lang = ''; } }
if (!T[lang]) lang = (navigator.language || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en';
let step = -1, picks = [], result = params.get('r') && Q.endings[params.get('r')] ? params.get('r') : null;
const $s = document.getElementById('screen');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const play = (id) => `${PLAY}&referrer=${encodeURIComponent(`utm_source=quiz&utm_medium=web&utm_campaign=${id || 'quiz'}`)}`;
const playBtn = (id) => `<a class="btn btn-play" href="${play(id)}" target="_blank" rel="noopener"><img src="../assets/img/icon-64.png" alt="" width="36" height="36"><span class="txt"><small>${esc(T[lang].free)}</small><b>Google Play</b></span></a>`;

function render() {
  const L = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
  document.getElementById('home').textContent = L.home;
  document.getElementById('fPriv').textContent = L.priv;
  document.querySelector('.play-foot').href = play('footer');
  $s.classList.remove('fade'); void $s.offsetWidth; $s.classList.add('fade');
  if (result) return renderResult();
  if (step < 0) {
    $s.innerHTML = `<img class="cover" src="img/cover.jpg" alt="">
      <span class="eyebrow top-gap">${esc(L.eyebrow)}</span>
      <h1 class="q-title">${L.title}</h1><p class="q-lead">${esc(L.lead)}</p>
      <div class="actions"><button class="btn btn-teal" id="go">${esc(L.start)}</button>${playBtn('quiz')}</div>
      <div class="meta-row"><span><b>9</b> ${esc(L.m1)}</span><span><b>11</b> ${esc(L.m2)}</span><span><b>1</b> ${esc(L.m3)}</span></div>`;
    document.getElementById('go').onclick = () => { step = 0; picks = []; render(); };
    return;
  }
  const q = Q.questions[step];
  $s.innerHTML = `<div class="progress"><div class="bar"><i style="width:${(step / Q.questions.length) * 100}%"></i></div><span>${step + 1}/${Q.questions.length}</span></div>
    <span class="eyebrow">${esc(L.q)} ${step + 1}</span>
    <h2 class="question">${esc(q[lang])}</h2>
    <div class="answers">${q.a.map((a, i) => `<button data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(a[lang])}</span></button>`).join('')}</div>
    ${step > 0 ? `<button class="back" id="back">${esc(L.back)}</button>` : ''}`;
  $s.querySelectorAll('.answers button').forEach((b) => (b.onclick = () => answer(+b.dataset.i)));
  const back = document.getElementById('back'); if (back) back.onclick = () => { picks.pop(); step -= 1; render(); };
}
function answer(i) {
  picks[step] = i; step += 1;
  if (step >= Q.questions.length) {
    const sc = {};
    picks.forEach((ai, qi) => { const s = Q.questions[qi].a[ai].s; for (const k in s) sc[k] = (sc[k] || 0) + s[k]; });
    let best = null, top = -1;
    for (const id of Q.order) { const v = sc[id] || 0; if (v > top) { top = v; best = id; } }
    result = best;
    history.replaceState(null, '', `?r=${best}${lang === 'ru' ? '&lang=ru' : ''}`);
  }
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function renderResult() {
  const L = T[lang]; const e = Q.endings[result][lang];
  const url = `${BASE}r/${result}/${lang === 'ru' ? '?lang=ru' : ''}`;
  const text = L.shareText(e[0]); const enc = encodeURIComponent;
  $s.innerHTML = `<img class="cover" src="${IMG(result)}" alt="">
    <span class="eyebrow top-gap">${esc(L.your)} · ${esc(L.of)}</span>
    <div class="rname">${esc(e[0])}</div>
    <p class="rdesc">${esc(e[1])}</p>
    <p class="flavor">${esc(e[2])}</p>
    <div class="share-h">${esc(L.shareH)}</div>
    <div class="share">
      <button class="main" id="shareNative">${esc(L.shareMain)}</button>
      <a href="https://twitter.com/intent/tweet?text=${enc(text)}&url=${enc(url)}" target="_blank" rel="noopener">X</a>
      <a href="https://t.me/share/url?url=${enc(url)}&text=${enc(text)}" target="_blank" rel="noopener">Telegram</a>
      <a href="https://api.whatsapp.com/send?text=${enc(text + ' ' + url)}" target="_blank" rel="noopener">WhatsApp</a>
      <a href="https://www.facebook.com/sharer/sharer.php?u=${enc(url)}" target="_blank" rel="noopener">Facebook</a>
      <a href="https://www.reddit.com/submit?url=${enc(url)}&title=${enc(text)}" target="_blank" rel="noopener">Reddit</a>
      <button id="copy">${esc(L.copy)}</button>
    </div>
    <p class="hint">${esc(L.hint)}</p>
    <div class="result-actions">${playBtn(result)}<button class="btn btn-ghost" id="again">${esc(L.again)}</button></div>
    <div class="others"><div class="share-h">${esc(L.others)}</div><div class="row">${Q.order.map((id) => `<img src="${IMG(id)}" alt="${esc(Q.endings[id][lang][0])}" title="${esc(Q.endings[id][lang][0])}" class="${id === result ? 'me' : ''}" loading="lazy">`).join('')}</div></div>`;
  document.getElementById('again').onclick = () => { result = null; step = 0; picks = []; history.replaceState(null, '', location.pathname + (lang === 'ru' ? '?lang=ru' : '')); render(); window.scrollTo({ top: 0 }); };
  const copy = document.getElementById('copy');
  copy.onclick = () => {
    const done = () => { copy.textContent = L.copied; setTimeout(() => (copy.textContent = L.copy), 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(text + ' ' + url).then(done, () => {}); else prompt('', text + ' ' + url);
  };
  document.getElementById('shareNative').onclick = () => { if (navigator.share) navigator.share({ title: 'AI CEO Tycoon', text, url }).catch(() => {}); else copy.onclick(); };
}
document.querySelectorAll('.lang button').forEach((b) => (b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('site.lang', lang); } catch (e) { /* без сохранения */ } render(); }));
addEventListener('keydown', (e) => { if (step >= 0 && !result && /^[1-4a-dA-D]$/.test(e.key)) answer('1234'.includes(e.key) ? +e.key - 1 : 'abcd'.indexOf(e.key.toLowerCase())); });
render();
</script>
</body>
</html>
